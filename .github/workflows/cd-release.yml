name: "CD - Release"

on:
  push:
    branches:
      - main
  # Manual republish of an existing release tag. npm trusted publishing checks
  # the filename of the top-level workflow that ran `pnpm publish`, so manual
  # retries must run from this file too.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g., v0.1.0)"
        required: true
        type: string

jobs:
  # Release-please analyzes conventional commit messages since the last release
  # and either creates or updates a release PR with:
  #   - A version bump in package.json
  #   - An updated CHANGELOG.md
  #
  # When that release PR is merged, release-please creates a git tag and
  # GitHub Release, and the publish job below publishes that tag to npm.
  release-please:
    # Only a push can cut a release. A manual dispatch skips this job, so it
    # never gets write access, and publishes the tag it was given.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing lives in this workflow, not a reusable one: npm's trusted
  # publisher is bound to this workflow file plus the `npm` environment, and
  # GitHub reports the calling workflow's filename in the OIDC token.
  publish:
    needs: release-please
    # !cancelled() lets this job run when release-please was skipped on a
    # manual dispatch. On a push, release-please must also have succeeded.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'))
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@common-grants/cg-grants-gov
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # A manual dispatch can pass any string; reject anything that is not a
      # release tag before checkout.
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::tag must look like 'vX.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # refs/tags/ pins the checkout to the tag namespace; a same-named branch
      # cannot be substituted.
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Lint, types, build, tests and the package smoke test must pass before
      # publishing. `pnpm audit` is left to the daily sweep (audit.yml) so a
      # newly published advisory can't block a release.
      - run: pnpm run ci:code

      # pnpm publish shells out to the system npm, which must be >= 11.5.1 for
      # OIDC trusted publishing; Node 22 bundles an older npm. Pinned to the
      # 11.x line so a new npm major can't reach this job unreviewed.
      - run: npm install -g npm@^11.5.1

      - name: Publish
        run: pnpm publish --provenance --access public --no-git-checks
