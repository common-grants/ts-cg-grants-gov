name: CI

on:
  pull_request:

jobs:
  # Lint the PR title to ensure it follows conventional commit messages
  # release-please relies on conventional commit messages to determine the version bump
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Audit is intentionally not part of this job: new advisories against
      # deps already on main would red every open PR. Dep-changing PRs are
      # audited by audit.yml (path-scoped); everything else is covered by its
      # daily scheduled sweep. `pnpm run ci` locally still includes the audit.
      - run: pnpm run ci:code
