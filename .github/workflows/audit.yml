name: Dependency Audit

# Runs `pnpm audit` in two situations:
#   1. PRs that change dependencies — so a PR can't introduce a known advisory.
#   2. A daily scheduled sweep on main — so advisories published against deps
#      already on main are caught within a day (as a tracking issue) instead of
#      redding every open PR the moment a GHSA drops.
on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/audit.yml
  schedule:
    # Daily at 15:00 UTC (8am PDT / 7am PST)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit

      - name: Open tracking issue on scheduled failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Scheduled dependency audit is failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The scheduled \`pnpm audit\` sweep found advisories against deps on \`main\`. See the run log for details: $RUN_URL"
          fi
